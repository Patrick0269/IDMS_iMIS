<style>:root{--maroon:#6b1025;--deep:#430715;--gold:#d4ad5b;--ink:#292529;--muted:#696167;--line:#e6dadd;--paper:#f7f2f4;--white:#fff;--shadow:0 12px 36px rgba(63,9,26,.1)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,"Segoe UI",Arial,sans-serif}.top{background:linear-gradient(120deg,var(--deep),var(--maroon));color:#fff;padding:17px max(22px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}.top a{color:white;text-decoration:none}.brand{font:700 18px "Source Serif 4",Georgia,serif}.shell{width:min(1120px,calc(100% - 32px));margin:34px auto 60px}.intro h1{margin:7px 0;color:var(--deep);font:700 clamp(30px,4vw,44px) "Source Serif 4",Georgia,serif}.intro p,.muted{color:var(--muted)}.search{display:flex;gap:10px;margin:20px 0}.search input{flex:1;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit}.search button,.page-button{border:0;border-radius:6px;padding:10px 16px;background:var(--maroon);color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{overflow:hidden;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:var(--shadow)}.card img{width:100%;height:190px;object-fit:cover}.card-body{padding:18px}.card small{color:var(--maroon);font-weight:750}.card h2{margin:7px 0;color:var(--deep);font:700 20px "Source Serif 4",Georgia,serif}.card p{color:var(--muted)}.card a,.back{color:var(--maroon);font-weight:700}.pagination{display:flex;align-items:center;justify-content:center;gap:14px;margin:25px}.detail{max-width:850px;margin:auto;padding:28px;background:#fff;border-radius:10px;box-shadow:var(--shadow)}.detail img{max-width:100%;max-height:460px;object-fit:cover}.detail h1{font:700 34px "Source Serif 4",Georgia,serif;color:var(--deep)}.body-copy{white-space:pre-wrap}.notice{padding:14px;background:#fff;border-left:4px solid var
