<html lang="en">
<head>

<title>IDMC iMIS | Integrated Management Information System</title>

<style>
    :root {
        --maroon: #6b1025;
        --deep: #430715;
        --light: #9d3350;
        --white: #ffffff;
        --text: #3d4048;
        --muted: #737780;
        --line: #dedee2;
        --error: #b42318;
        --success: #087443;
        --font-serif: "Source Serif 4", Georgia, "Times New Roman", serif;
        --font-sans: "Inter", "Segoe UI", Arial, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        font-family: var(--font-sans);
        color: var(--text);
        background:
            radial-gradient(
                circle at 8% 78%,
                rgba(107, 16, 37, .09) 0 18%,
                transparent 18.2%
            ),
            linear-gradient(
                135deg,
                #fbf6f7,
                #eee0e4
            );
    }

    .portal-card {
        width: min(100%, 440px);
        overflow: hidden;
        border-radius: 22px;
        background: var(--white);
        box-shadow:
            0 20px 50px rgba(67, 7, 21, .16);
    }

    /* =========================
       HEADER
       ========================= */

    .portal-header {
        position: relative;
        min-height: 224px;
        padding: 38px 32px 68px;
        text-align: center;
        color: var(--white);

        background:
            radial-gradient(
                circle at 90% 8%,
                rgba(255,255,255,.14) 0 14%,
                transparent 14.4%
            ),
            radial-gradient(
                circle at 4% 98%,
                rgba(255,255,255,.10) 0 29%,
                transparent 29.4%
            ),
            linear-gradient(
                135deg,
                var(--deep),
                var(--maroon) 55%,
                var(--light)
            );
    }

    .portal-header::after {
        content: "";
        position: absolute;
        inset: 0;

        background:
            linear-gradient(
                120deg,
                transparent 35%,
                rgba(255,255,255,.07) 50%,
                transparent 65%
            );

        pointer-events: none;
    }

    .institution-name {
        position: relative;
        z-index: 1;

        font-family: var(--font-serif);
        font-size: clamp(22px, 5.4vw, 28px);
        line-height: 1.18;
        font-weight: 700;
        letter-spacing: -.2px;
    }

    .portal-name {
        position: relative;
        z-index: 1;

        margin-top: 12px;

        color: rgba(255,255,255,.80);

        font-size: 13.5px;
        line-height: 1.5;
        font-weight: 500;
        letter-spacing: .01em;
    }

    /* =========================
       LOGO
       ========================= */

    .logo {
        position: absolute;
        z-index: 2;

        left: 50%;
        bottom: -38px;

        width: 78px;
        height: 78px;

        display: grid;
        place-items: center;

        transform: translateX(-50%);

        border: 3px solid var(--white);
        border-radius: 50%;

        color: var(--maroon);
        background: var(--white);

        box-shadow:
            0 8px 20px rgba(67,7,21,.20);

        font-family: var(--font-serif);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -.5px;
    }

    /* =========================
       LOGIN CONTENT
       ========================= */

    .login-content {
        padding: 64px 38px 36px;
    }

    .message {
        display: none;

        margin-bottom: 18px;
        padding: 11px 13px;

        border-radius: 9px;

        font-size: 13px;
        line-height: 1.45;
    }

    .message.show {
        display: block;
    }

    .message.error {
        color: var(--error);
        background: #fff1f0;
        border: 1px solid #ffd0ca;
    }

    .message.success {
        color: var(--success);
        background: #ecfdf3;
        border: 1px solid #abefc6;
    }

    .field {
        margin-bottom: 19px;
    }

    .access-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 22px;
        padding: 5px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #f7f4f5;
    }

    .access-switch button {
        min-height: 40px;
        border: 0;
        border-radius: 8px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
    }

    .access-switch button.active {
        color: var(--white);
        background: var(--maroon);
        box-shadow: 0 5px 12px rgba(107,16,37,.18);
    }

    .access-help {
        margin: -10px 0 18px;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.55;
    }

    label {
        display: block;

        margin-bottom: 7px;

        font-size: 13.5px;
        font-weight: 700;
        color: var(--text);
    }

    input {
        width: 100%;
        height: 48px;

        border: 1px solid var(--line);
        border-radius: 11px;

        padding: 0 15px;

        color: var(--text);
        background: var(--white);

        font: inherit;
        font-size: 14.5px;

        outline: none;

        transition:
            border-color .2s,
            box-shadow .2s;
    }

    input:focus {
        border-color: var(--maroon);

        box-shadow:
            0 0 0 4px rgba(107,16,37,.12);
    }

    input::placeholder {
        color: #9a9da4;
    }

    /* =========================
       PASSWORD
       ========================= */

    .password-field {
        position: relative;
    }

    .password-field input {
        padding-right: 68px;
    }

    .password-toggle {
        position: absolute;

        top: 50%;
        right: 8px;

        transform: translateY(-50%);

        min-width: 48px;
        height: 32px;

        border: 0;
        border-radius: 7px;

        color: var(--maroon);
        background: #f8ebee;

        cursor: pointer;

        font-size: 12.5px;
        font-weight: 700;
    }

    .password-toggle:hover {
        background: #f2dfe4;
    }

    /* =========================
       LOGIN BUTTON
       ========================= */

    .login-button {
        width: 100%;
        height: 50px;

        margin-top: 5px;

        border: 0;
        border-radius: 11px;

        color: var(--white);
        background: var(--maroon);

        box-shadow:
            0 10px 20px rgba(107,16,37,.20);

        cursor: pointer;

        font: inherit;
        font-size: 15.5px;
        font-weight: 700;
        letter-spacing: .01em;

        transition:
            background .2s,
            transform .2s,
            opacity .2s;
    }

    .login-button:hover:not(:disabled) {
        background: var(--deep);
        transform: translateY(-1px);
    }

    .login-button:disabled {
        cursor: not-allowed;
        opacity: .7;
    }

    /* =========================
       FORGOT PASSWORD
       ========================= */

    .forgot-password {
        display: block;

        width: fit-content;

        margin: 22px auto 0;

        border: 0;

        color: var(--muted);
        background: transparent;

        cursor: pointer;

        font: inherit;
        font-size: 13.5px;
    }

    .forgot-password:hover {
        color: var(--maroon);
        text-decoration: underline;
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
        margin-top: 28px;

        color: #93959b;

        text-align: center;

        font-size: 11px;
        letter-spacing: .02em;
        line-height: 1.6;
    }

    /* =========================
       LOADING
       ========================= */

    .login-button.loading {
        position: relative;
    }

    .login-button.loading::after {
        content: "";

        display: inline-block;

        width: 13px;
        height: 13px;

        margin-left: 8px;

        border: 2px solid rgba(255,255,255,.45);
        border-top-color: #fff;

        border-radius: 50%;

        vertical-align: -2px;

        animation: spin .7s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 500px) {

        body {
            padding: 14px;
        }

        .portal-card {
            width: 100%;
            border-radius: 20px;
        }

        .portal-header {
            min-height: 205px;
            padding: 34px 22px 62px;
        }

        .login-content {
            padding: 58px 24px 30px;
        }

        .institution-name {
            font-size: 22px;
        }

        .portal-name {
            font-size: 12.5px;
        }

        .logo {
            width: 70px;
            height: 70px;
            bottom: -34px;
        }

    }
</style>

<body>

<main class="portal-card">

<!-- =========================
     IDMC HEADER
     ========================= -->

<header class="portal-header">

    <h1 class="institution-name">
        Institute of Development<br>
        and Medical Sciences
    </h1>

    <p class="portal-name">
        Integrated Management Information System
    </p>

    <!--
        IDMC

        Baadaye tunaweza kuweka logo halisi
        ya taasisi hapa bila kubadilisha layout.
    -->

    <div
        class="logo"
        aria-label="IDMC logo">

        IDMC

    </div>

</header>


<!-- =========================
     LOGIN SECTION
     ========================= -->

<section
    class="login-content"
    aria-label="IDMC iMIS Sign in">

    <div
        id="loginMessage"
        class="message"
        role="alert"
        aria-live="polite">
    </div>


    <form
        id="loginForm"
        autocomplete="on">

        <!-- Shared identifier for staff and students -->

        <div class="field">

            <label for="username">
                Email, username or Student Number
            </label>

            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                placeholder="Enter your institutional email, username or student number"
                inputmode="text"
                spellcheck="false"
                required>

        </div>

        <p class="access-help">
            Use the identifier assigned to your account. Your portal and access will be loaded from your verified account roles.
        </p>


        <!-- PASSWORD -->

        <div class="field">

            <label for="password">
                Password
            </label>

            <div class="password-field">

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter password"
                    required>

                <button
                    id="togglePassword"
                    class="password-toggle"
                    type="button"
                    aria-label="Show password">

                    Show

                </button>

            </div>

        </div>


        <!-- LOGIN -->

        <button
            id="loginButton"
            class="login-button"
            type="submit">

            Log In

        </button>

    </form>


    <!-- FORGOT PASSWORD -->

    <button
        id="forgotPassword"
        class="forgot-password"
        type="button">

        Forgot password?

    </button>


    <p class="footer">
        IDMC iMIS · Secure Institutional Access
    </p>

</section>

</main>

<!-- =========================
     IDMC CONFIGURATION
     ========================= -->

<script src="assets/js/config.js"></script>

<script src="assets/js/auth.js?v=20261011-friendly-network-errors"></script>

<script>

(async function () {

    "use strict";


    /* =========================================
       EXISTING SESSION CHECK
       ========================================= */

    const existingSession =
        IDMCAuth.getSession();

    if (existingSession) {

        try {

            await IDMCAuth.getCurrentUser();

            IDMCAuth.redirectAfterLogin();

            return;

        } catch (error) {

            console.warn(
                "Existing session invalid:",
                error
            );

            IDMCAuth.clearSession();

        }

    }


    /* =========================================
       ELEMENTS
       ========================================= */

    const loginForm =
        document.getElementById(
            "loginForm"
        );

    const usernameInput =
        document.getElementById(
            "username"
        );

    const passwordInput =
        document.getElementById(
            "password"
        );

    const togglePassword =
        document.getElementById(
            "togglePassword"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );

    const loginMessage =
        document.getElementById(
            "loginMessage"
        );

    const forgotPassword =
        document.getElementById(
            "forgotPassword"
        );


    /* =========================================
       MESSAGE
       ========================================= */

    function showMessage(
        message,
        type = "error"
    ) {

        loginMessage.textContent =
            message;

        loginMessage.className =
            `message show ${type}`;

    }


    function clearMessage() {

        loginMessage.textContent = "";

        loginMessage.className =
            "message";

    }


    /* =========================================
       PASSWORD SHOW / HIDE
       ========================================= */

    togglePassword.addEventListener(
        "click",
        function () {

            const visible =
                passwordInput.type === "text";

            passwordInput.type =
                visible
                    ? "password"
                    : "text";

            togglePassword.textContent =
                visible
                    ? "Show"
                    : "Hide";

            togglePassword.setAttribute(
                "aria-label",
                visible
                    ? "Show password"
                    : "Hide password"
            );

        }
    );


    /* =========================================
       LOGIN
       ========================================= */

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            clearMessage();

            const username =
                usernameInput.value.trim();

            const password =
                passwordInput.value;

            if (!username || !password) {

                showMessage("Enter your account identifier and password.");

                return;
            }


            loginButton.disabled = true;

            loginButton.classList.add(
                "loading"
            );

            loginButton.textContent =
                "Signing in...";


            try {

                /*
                 * Supabase authentication
                 *
                 * The backend authentication
                 * layer will then verify the
                 * authenticated user against
                 * IDMC iMIS public.users.
                 */

                /*
                 * Canonical IDMC iMIS login.
                 *
                 * The backend resolves the identifier
                 * (email, student number, or staff
                 * number) to the account's registered
                 * email before authenticating against
                 * Supabase, so both staff and students
                 * can sign in with their own identifier.
                 */

                const studentNumberPattern = /^(?:IDMC\/\d{4}\/\d{5}|N[A-Z]\d{4}\/\d{4}\/\d{4})$/i;
                if (studentNumberPattern.test(username.replace(/\s+/g, ""))) {
                    const studentNumber = username.replace(/\s+/g, "").toUpperCase();
                    await IDMCAuth.studentLogin(studentNumber, password);
                } else {
                    await IDMCAuth.login(username, password);
                }


                /*
                 * Verify the authenticated account
                 * against the IDMC iMIS backend.
                 */

                const userData =
                    await IDMCAuth.getCurrentUser();


                if (!userData) {
                    throw new Error("Your account could not be verified in IDMC iMIS.");
                }

                // The backend intentionally returns a compact, flat account
                // payload for students who must change their temporary
                // password. Route them before applying the regular staff
                // response-shape checks; otherwise login cleanup clears this
                // newly issued session before the password page can use it.
                if (userData.mustChangePassword) {
                    window.location.replace("student-first-password.html");
                    return;
                }

                const verifiedUser = userData.user || userData;
                if (verifiedUser.status !== "ACTIVE") {
                    throw new Error(
                        `Your IDMC iMIS account is ${verifiedUser.status}. Please contact the ICT Office.`
                    );
                }


                /*
                 * =================================================
                 * ROLE-BASED LANDING PAGE
                 * =================================================
                 *
                 * STUDENT -> student-portal.html
                 * STAFF   -> dashboard.html
                 *
                 */

                const destination = IDMCAuth.getLandingPage();

                showMessage(
                    destination === "access-denied.html"
                        ? "Your account is verified, but no active portal role is assigned. Contact an authorised administrator to review your access."
                        : "Login successful. Opening your authorised portal...",
                    "success"
                );


                /*
                 * Small delay so the user can see
                 * successful login message.
                 */

                window.setTimeout(
                    function () {

                        window.location.replace(destination);

                    },
                    450
                );


            } catch (error) {

                console.error(
                    "IDMC login error:",
                    error
                );


                IDMCAuth.clearSession();


                showMessage(
                    error?.message ||
                    "Unable to sign in. Please check your credentials and try again."
                );


            } finally {

                loginButton.disabled =
                    false;

                loginButton.classList.remove(
                    "loading"
                );

                loginButton.textContent =
                    "Log In";

            }

        }
    );


    /* =========================================
       FORGOT PASSWORD
       ========================================= */

    forgotPassword.addEventListener("click", function () {
        window.location.href = "forgot-password.html";
    });


    /* =========================================
       AUTO FOCUS
       ========================================= */

    usernameInput.focus();

})();

</script>
