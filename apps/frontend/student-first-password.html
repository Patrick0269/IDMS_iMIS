<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#68152c">
  <title>Badili password · IDMC</title>
  <style>
    :root{color-scheme:light;--wine:#68152c;--ink:#35252b;--muted:#75666b;--line:#e8dce0;--soft:#fbf6f7}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:clamp(16px,5vh,56px) 16px;background:radial-gradient(ellipse at top,#fff 0,var(--soft) 62%,#f4ecef 100%);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,480px);margin:0 auto;padding:clamp(22px,5vw,36px);background:#fff;border:1px solid var(--line);border-top:6px solid var(--wine);border-radius:18px;box-shadow:0 18px 55px #32101b12}
    h1{margin:0 0 10px;color:var(--wine);font:700 clamp(1.6rem,6vw,2rem)/1.2 Georgia,serif}
    p{color:var(--muted)}
    .intro{margin:0 0 8px}.hint{margin:0 0 22px;font-size:.94rem}
    label{display:block;margin:18px 0;font-weight:650}
    input{display:block;width:100%;min-height:48px;margin-top:7px;padding:11px 13px;border:1px solid #cfc2c7;border-radius:10px;background:#fff;color:var(--ink);font:inherit}
    input:focus{outline:3px solid #68152c24;border-color:var(--wine)}
    .submit{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;margin-top:8px;padding:12px 16px;border:0;border-radius:10px;background:var(--wine);color:#fff;font:700 1rem system-ui;cursor:pointer}
    .submit:disabled{opacity:.72;cursor:wait}
    .spinner{width:18px;height:18px;border:2px solid #ffffff80;border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .progress{display:flex;align-items:center;gap:11px;margin:14px 0 0;padding:12px 14px;border:1px solid #eadce1;border-radius:10px;background:#fbf4f6;color:var(--wine);font-size:.94rem}
    .progress[hidden]{display:none}.progress .spinner{flex:0 0 18px;border-color:#e4cbd4;border-top-color:var(--wine)}
    #message{min-height:1.5em;margin:12px 0 0;white-space:pre-wrap}
    #message.error{color:#a32121}#message.success{color:#176b46}
    .logout{margin-top:14px;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--wine);font:600 .95rem system-ui;cursor:pointer}
    .retry{margin:12px 8px 0 0;padding:9px 13px;border:1px solid var(--wine);border-radius:9px;background:#fff;color:var(--wine);font:650 .95rem system-ui;cursor:pointer}
    .retry[hidden]{display:none}
    @media(max-width:520px){body{padding:16px 12px}main{padding:22px 18px;border-radius:14px}label{margin:16px 0}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
  <script>window.IDMC_DISABLE_GLOBAL_PROGRESS=true;</script>
</head>
<body>
  <main>
    <h1>Badili password yako</h1>
    <p class="intro">Lazima ubadili password ya muda kabla ya kuendelea kwenye Student Portal.</p>
    <p class="hint">Tumia angalau herufi 10, ikijumuisha herufi kubwa, ndogo na namba.</p>
    <form id="form" novalidate>
      <label for="current">Password ya muda
        <input id="current" type="password" autocomplete="current-password" required>
      </label>
      <label for="next">Password mpya
        <input id="next" type="password" autocomplete="new-password" minlength="10" required>
      </label>
      <label for="confirm">Rudia password mpya
        <input id="confirm" type="password" autocomplete="new-password" minlength="10" required>
      </label>
      <button class="submit" id="save" type="submit">Badili password na endelea</button>
      <div id="progress" class="progress" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span><span id="progressText">Inapakia taarifa…</span>
      </div>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <button id="retryValidation" class="retry" type="button" hidden>Jaribu tena kuthibitisha akaunti</button>
    <button id="logout" class="logout" type="button">Toka</button>
  </main>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api.js?v=20261009-single"></script>
  <script src="assets/js/student-first-password.js"></script>
</body>
</html>
