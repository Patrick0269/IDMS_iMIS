<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#68172a">
  <title>Forgot password | IDMC iMIS</title>
  <link rel="stylesheet" href="assets/css/idmc-deep-ui.css">
  <style>
    :root{--maroon:#68172a;--ink:#25232a;--muted:#68656d;--line:#e8e2e4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,#f7f2f3,#eee9eb);font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif;color:var(--ink)}
    .card{width:min(100%,560px);padding:clamp(24px,5vw,42px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 55px #38131d18}.brand{color:var(--maroon);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:8px 0;color:var(--maroon);font-size:clamp(1.6rem,4vw,2rem)}.intro{margin:0 0 24px;color:var(--muted)}label{display:block;margin:15px 0 6px;font-weight:650}input,select{width:100%;min-height:46px;padding:10px 12px;border:1px solid #cbc3c6;border-radius:8px;background:#fff;color:var(--ink);font:inherit}input:focus,select:focus{outline:3px solid #68172a25;border-color:var(--maroon)}.fields{padding:0;border:0;margin:0}.fields[hidden]{display:none}.hint{margin:7px 0;color:var(--muted);font-size:.9rem}.submit{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:var(--maroon);color:#fff;font:inherit;font-weight:700;cursor:pointer}.submit:disabled{opacity:.65;cursor:wait}.message{display:none;margin-top:16px;padding:13px;border-radius:8px;background:#f3edf0;color:#4f1222}.message.show{display:block}.back{display:inline-block;margin-top:20px;color:var(--maroon);font-weight:650;text-decoration:none}.back:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">IDMC · Account Recovery</div>
    <h1>Forgot password?</h1>
    <p class="intro">Chagua aina ya akaunti na weka taarifa zinazolingana na rekodi zako za IDMC. Kama taarifa zikithibitishwa, tutatuma link ya kubadilisha nenosiri kwenye email iliyosajiliwa.</p>
    <form id="recoveryForm" novalidate>
      <label for="accountType">Aina ya akaunti</label>
      <select id="accountType" name="accountType" required>
        <option value="student">Student / Mwanafunzi</option>
        <option value="lecturer">Lecturer / Mhadhiri</option>
      </select>
      <fieldset class="fields" id="studentFields">
        <label for="registrationNumber">Registration Number</label>
        <input id="registrationNumber" name="registrationNumber" autocomplete="username" placeholder="Mfano: NS1179/0269/2020" maxlength="50">
        <label for="studentEmail">Email iliyosajiliwa kwenye akaunti</label>
        <input id="studentEmail" name="studentEmail" type="email" autocomplete="email" placeholder="jina@example.com" maxlength="255">
        <label for="formFourYear">Mwaka uliomaliza Form Four (CSEE)</label>
        <input id="formFourYear" name="formFourYear" type="number" min="1950" max="2100" inputmode="numeric" placeholder="Mfano: 2020">
      </fieldset>
      <fieldset class="fields" id="lecturerFields" hidden>
        <label for="lecturerPhone">Namba ya simu iliyopo kwenye taarifa za staff</label>
        <input id="lecturerPhone" name="phone" type="tel" autocomplete="tel" placeholder="Mfano: 0712 345 678" maxlength="30" disabled>
        <label for="lecturerEmail">Email ya akaunti ya IDMC</label>
        <input id="lecturerEmail" name="lecturerEmail" type="email" autocomplete="email" placeholder="jina@idmc.ac.tz" maxlength="255" disabled>
      </fieldset>
      <button class="submit" id="submitButton" type="submit">Thibitisha na tuma link</button>
    </form>
    <div class="message" id="resultMessage" role="status" aria-live="polite"></div>
    <a class="back" href="login.html">← Rudi kwenye login</a>
  </main>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js?v=20261011-friendly-network-errors"></script>
  <script>
    (function(){
      const form=document.getElementById('recoveryForm'),type=document.getElementById('accountType'),students=document.getElementById('studentFields'),lecturers=document.getElementById('lecturerFields'),message=document.getElementById('resultMessage'),button=document.getElementById('submitButton');
      function toggle(){const isStudent=type.value==='student';students.hidden=!isStudent;lecturers.hidden=isStudent;students.querySelectorAll('input').forEach(input=>{input.disabled=!isStudent;input.required=isStudent;});lecturers.querySelectorAll('input').forEach(input=>{input.disabled=isStudent;input.required=!isStudent;});message.className='message';message.textContent='';}
      type.addEventListener('change',toggle);toggle();
      form.addEventListener('submit',async function(event){event.preventDefault();message.className='message';message.textContent='';if(!form.reportValidity())return;
        const fields={accountType:type.value,email:(type.value==='student'?form.elements.studentEmail:form.elements.lecturerEmail).value.trim()};
        if(type.value==='student'){fields.registrationNumber=form.elements.registrationNumber.value.trim();fields.formFourYear=Number(form.elements.formFourYear.value);if(!Number.isInteger(fields.formFourYear)||fields.formFourYear<1950||fields.formFourYear>new Date().getFullYear()){message.textContent='Weka mwaka sahihi wa kumaliza Form Four.';message.className='message show';return;}}
        else fields.phone=form.elements.phone.value.trim();
        button.disabled=true;button.textContent='Inathibitisha...';
        try{const result=await IDMCAuth.requestVerifiedPasswordReset(fields);message.textContent=result.message||'Kama taarifa zako zimethibitishwa, link ya kubadilisha nenosiri itatumwa kwenye email yako.';message.className='message show';form.reset();toggle();}
        catch(error){message.textContent=error.message||'Ombi halijafanikiwa. Jaribu tena.';message.className='message show';}
        finally{button.disabled=false;button.textContent='Thibitisha na tuma link';}
      });
    })();
  </script>
</body>
</html>
