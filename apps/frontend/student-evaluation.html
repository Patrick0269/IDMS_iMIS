<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Course Evaluation | IDMC iMIS Student Panel</title>
  <link rel="stylesheet" href="assets/css/student-portal-pages.css"><link rel="stylesheet" href="assets/css/student-panel-final.css"><link rel="stylesheet" href="assets/css/student-shell.css">
<script src="assets/js/action-progress.js?v=20261009-single"></script>
<link rel="stylesheet" href="assets/css/hr-staff-layout.css?v=20261008-offering-hr"></head>
<body><div class="portal-shell">
  <header class="portal-header"><div class="portal-header-inner"><a class="portal-brand" href="student-portal.html"><span class="portal-brand-mark">IDMC</span><span>IDMC iMIS<small>Student Panel</small></span></a></div></header>
  <div class="portal-layout">
    <aside class="portal-sidebar" id="studentSidebar"><section class="portal-student-card"><h3 id="studentName">Student</h3><p><strong>Student No:</strong> <span id="studentNumber">—</span></p><p><strong>Programme:</strong> <span id="studentProgramme">—</span></p></section><nav class="portal-nav" aria-label="Student services"></nav></aside>
    <main class="portal-main"><section class="portal-page-heading"><h1>Course Evaluation</h1><p>Share feedback on the registered courses you are taking at IDMC.</p></section>
      <div id="evaluationMessage" class="portal-state" role="status" aria-live="polite" hidden></div>
      <section class="portal-card"><div class="portal-card-header"><h2>Evaluate a Registered Course</h2></div><div class="portal-card-body"><form id="evaluationForm" class="idmc-password-form">
        <label class="idmc-form-wide">Registered course<select name="courseOfferingId" id="evaluationCourse" required><option value="">Loading registered courses…</option></select></label>
        <label>Overall rating<select name="rating" required><option value="">Select rating</option><option value="5">5 — Excellent</option><option value="4">4 — Very good</option><option value="3">3 — Good</option><option value="2">2 — Fair</option><option value="1">1 — Poor</option></select></label>
        <label>Lecturer preparation<select name="lecturerPreparation"><option value="">Optional</option><option value="5">5 — Excellent</option><option value="4">4 — Very good</option><option value="3">3 — Good</option><option value="2">2 — Fair</option><option value="1">1 — Poor</option></select></label>
        <label>Content delivery<select name="contentDelivery"><option value="">Optional</option><option value="5">5 — Excellent</option><option value="4">4 — Very good</option><option value="3">3 — Good</option><option value="2">2 — Fair</option><option value="1">1 — Poor</option></select></label>
        <label>Learning resources<select name="learningResources"><option value="">Optional</option><option value="5">5 — Excellent</option><option value="4">4 — Very good</option><option value="3">3 — Good</option><option value="2">2 — Fair</option><option value="1">1 — Poor</option></select></label>
        <label class="idmc-form-wide">Comment<textarea name="comment" rows="4" maxlength="2000" placeholder="Share any specific feedback (optional)"></textarea></label>
        <button class="portal-button" type="submit" id="evaluationSubmit">Submit evaluation</button>
      </form></div></section>
      <section class="portal-card idmc-security-history"><div class="portal-card-header"><h2>My Course Evaluations</h2></div><div class="portal-card-body" id="evaluationHistory">Loading course evaluations…</div></section>
    </main>
  </div>
</div>
<script src="assets/js/idmc-session.js"></script><script src="assets/js/config.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/api.js?v=20261009-single"></script><script src="assets/js/student-evaluation.js"></script><script type="module" src="assets/js/student-shell.js?v=20261009-single"></script>
<script src="assets/js/idmc-institution-logo.js?v=1791461354603" data-idmc-logo="true" data-logo="../images/idms-logo.jpg"></script>
<script defer src="assets/js/hr-staff-layout.js?v=20261008-offering-hr"></script><script defer src="assets/js/coursework-entry.js?v=20261009-single"></script></body></html>
