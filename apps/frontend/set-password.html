<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Set Password | IDMS iMIS</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #7a0019,
            #4d0010
        );

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.card {
    width: min(440px, 92%);

    background: #ffffff;

    border-radius: 14px;

    padding: 35px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);
}

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #7a0019;

    color: white;

    font-weight: 800;

    font-size: 20px;
}

h1 {
    margin: 0 0 8px;

    text-align: center;

    color: #222;
}

.subtitle {
    text-align: center;

    color: #777;

    margin-bottom: 28px;
}

label {
    display: block;

    margin-bottom: 7px;

    font-weight: 700;

    color: #333;
}

input {
    width: 100%;

    padding: 13px 14px;

    border:
        1px solid #d7d7d7;

    border-radius: 7px;

    margin-bottom: 18px;

    font-size: 15px;
}

button {
    width: 100%;

    padding: 14px;

    border: 0;

    border-radius: 7px;

    background: #7a0019;

    color: white;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;
}

button:hover {
    opacity: .92;
}

.message {
    margin-top: 18px;

    padding: 12px;

    border-radius: 7px;

    display: none;
}

.success {
    display: block;

    background: #e8f7ed;

    color: #166534;
}

.error {
    display: block;

    background: #fdecec;

    color: #991b1b;
}

</style>

    <link rel="stylesheet" href="assets/css/idmc-deep-ui.css">
    <link rel="stylesheet" href="assets/css/idmc-current-repair.css">
<script src="assets/js/action-progress.js?v=20261009-single"></script>
<link rel="stylesheet" href="assets/css/idmc-responsive-layout.css?v=20261011-responsive">
</head>

<body>

<div class="card">

<div class="logo">
IDMS
</div>

<h1>
Set Your Password
</h1>

<div class="subtitle">
IDMS Integrated Management Information System
</div>

<form id="passwordForm">

<label for="password">
New Password
</label>

<input
    id="password"
    type="password"
    minlength="12"
    required
    autocomplete="new-password"
>

<label for="confirmPassword">
Confirm Password
</label>

<input
    id="confirmPassword"
    type="password"
    minlength="12"
    required
    autocomplete="new-password"
>

<button
    type="submit"
    id="submitButton"
>
Set Password
</button>

</form>

<div
    id="message"
    class="message"
></div>

</div>

<script src="assets/js/config.js"></script>

<script>

const form =
    document.getElementById(
        "passwordForm"
    );

const message =
    document.getElementById(
        "message"
    );

const submitButton =
    document.getElementById(
        "submitButton"
    );

function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        `message ${type}`;

}

function getHashParams() {

    const hash =
        window.location.hash
            .replace(/^#/, "");

    return new URLSearchParams(hash);
}

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        const password =
            document.getElementById(
                "password"
            ).value;

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;

        if (password.length < 12 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/\d/.test(password)) {

            showMessage(
                "Password must contain at least 12 characters, including upper-case, lower-case and a number.",
                "error"
            );

            return;
        }

        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }

        const params =
            getHashParams();

        const accessToken =
            params.get(
                "access_token"
            );

        if (!accessToken) {

            showMessage(
                "This password setup link is invalid or expired.",
                "error"
            );

            return;
        }

        submitButton.disabled = true;

        submitButton.textContent =
            "Saving...";

        try {

            const response =
                await fetch(
                    `${IDMC_CONFIG.SUPABASE_URL}/auth/v1/user`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "apikey":
                                IDMC_CONFIG.SUPABASE_ANON_KEY,

                            "Authorization":
                                `Bearer ${accessToken}`
                        },

                        body: JSON.stringify({
                            password
                        })
                    }
                );

            const result =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    result?.msg ||
                    result?.message ||
                    "Unable to set password."
                );
            }

            const recorded = await fetch(`${IDMC_CONFIG.API_BASE_URL}/auth/password-setup-complete`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${accessToken}`
                },
                body: JSON.stringify({})
            });
            if (!recorded.ok) {
                throw new Error("Password was changed, but account security history could not be updated. Contact the Registry.");
            }

            showMessage(
                "Password created successfully. You can now sign in.",
                "success"
            );

            form.reset();

            setTimeout(
                () => {
                    window.location.href =
                        "login.html";
                },
                2000
            );

        } catch (error) {

            showMessage(
                error.message ||
                "Unable to set password.",
                "error"
            );

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Set Password";
        }

    }
);

</script>

    <script src="assets/js/idmc-current-repair.js"></script>
<script src="assets/js/idmc-institution-logo.js?v=1791461354603" data-idmc-logo="true" data-logo="../images/idms-logo.jpg"></script>
</body>

</html>
