<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documents | IDMC iMIS</title><link rel="stylesheet" href="assets/css/academic-workspaces.css"><script src="assets/js/action-progress.js?v=20261009-single"></script>
<link rel="stylesheet" href="assets/css/hr-staff-layout.css?v=20261008-offering-hr"></head><body><header class="aw-topbar"><div><strong>IDMC iMIS</strong><span>Institutional Documents</span></div><nav><a href="dashboard.html">Dashboard</a><button id="refreshDocuments" type="button">Refresh</button></nav></header><main class="aw-shell"><section class="aw-heading"><div><p>DOCUMENT REGISTRY</p><h1>Institutional Documents</h1><span>Upload actual document files to protected institutional storage. External URL entry is not used.</span></div><button class="aw-primary" id="openDocumentUpload" type="button">Upload Document</button></section><div id="documentMessage" class="aw-message" role="status"></div><section class="aw-panel active"><div class="aw-toolbar"><input type="search" id="documentSearch" placeholder="Search document number, title, type or status"><span id="documentCount">0 documents</span></div><div class="aw-table-wrap"><table><thead><tr><th>Document Number</th><th>Title</th><th>Type</th><th>File</th><th>Module</th><th>Visibility</th><th>Status</th><th>Uploaded</th></tr></thead><tbody id="documentRows"></tbody></table></div></section></main><dialog class="aw-dialog" id="documentDialog"><form id="documentForm"><div class="aw-dialog-title"><div><small>PROTECTED STORAGE</small><h2>Upload Document</h2></div><button id="closeDocumentUpload" type="button">×</button></div><div class="aw-form-grid"><label class="wide"><span>Institution *</span><select name="institutionId" required><option value="">Select institution</option></select></label><label><span>Document Number</span><input name="documentNumber" maxlength="100" placeholder="Leave blank to generate"></label><label><span>Document Type *</span><input name="documentType" required maxlength="100" placeholder="Policy, Minutes, Report..."></label><label class="wide"><span>Document Title *</span><input name="title" required maxlength="255"></label><label><span>Module</span><input name="moduleCode" maxlength="100" place
