<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Requests | IDMC iMIS Student Panel</title>
  <link rel="stylesheet" href="assets/css/student-portal-pages.css"><link rel="stylesheet" href="assets/css/student-panel-final.css"><link rel="stylesheet" href="assets/css/student-shell.css">
<script src="assets/js/action-progress.js?v=20261009-single"></script>
<link rel="stylesheet" href="assets/css/hr-staff-layout.css?v=20261008-offering-hr"></head>
<body><div class="portal-shell">
  <header class="portal-header"><div class="portal-header-inner"><a class="portal-brand" href="student-portal.html"><span class="portal-brand-mark">IDMC</span><span>IDMC iMIS<small>Student Panel</small></span></a></div></header>
  <div class="portal-layout">
    <aside class="portal-sidebar" id="studentSidebar"><section class="portal-student-card"><h3 id="studentName">Student</h3><p><strong>Student No:</strong> <span id="studentNumber">—</span></p><p><strong>Programme:</strong> <span id="studentProgramme">—</span></p></section><nav class="portal-nav" aria-label="Student services"></nav></aside>
    <main class="portal-main"><section class="portal-page-heading"><h1>Student Request Centre</h1><p>Submit and track requests supported by IDMC student services.</p></section>
      <div id="requestMessage" class="portal-state" role="status" aria-live="polite" hidden></div>
      <section class="portal-card"><div class="portal-card-header"><h2>Submit a Request</h2></div><div class="portal-card-body"><form id="studentRequestForm" class="idmc-password-form">
        <label>Request type<select name="requestType" id="requestType" required><option value="">Choose a request</option><option value="RESULT_APPEAL">Result Appeal</option><option value="POSTPONEMENT">Postponement</option><option value="TRANSCRIPT">Transcript</option><option value="ID_CARD">Student ID Card</option><option value="CERTIFICATE">Certificate</option><option value="GRADUATION_GOWN">Graduation Gown</option><option value="GENERAL">General Request or Suggestion</option></select></label>
        <label class="idmc-form-wide">Subject<input name="subject" maxlength="200" required></label>
        <label class="idmc-form-wide">Reason or details<textarea name="reason" rows="5" maxlength="5000" required></textarea></label>
        <label class="idmc-form-wide">Evidence link (optional)<input name="evidenceUrl" type="url" maxlength="2000" placeholder="https://…"></label>
        <button class="portal-button" id="submitRequest" type="submit">Submit request</button>
      </form></div></section>
      <section class="portal-card idmc-security-history"><div class="portal-card-header"><h2>My Request History</h2></div><div class="portal-card-body" id="requestHistory">Loading requests…</div></section>
    </main>
  </div>
</div>
<script src="assets/js/idmc-session.js"></script><script src="assets/js/config.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/api.js?v=20261011-friendly-network-errors"></script><script src="assets/js/student-request-center.js"></script><script type="module" src="assets/js/student-shell.js?v=20261009-single"></script>
