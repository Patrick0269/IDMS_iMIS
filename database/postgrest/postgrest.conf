# Self-managed PostgREST configuration for the restored PostgreSQL database.
# Supply credentials via PGRST_* environment variables; never commit passwords.
db-uri = "env(PGRST_DB_URI)"
db-schemas = "public"
db-extra-search-path = "public, extensions"
db-anon-role = "anon"
jwt-secret = "env(PGRST_JWT_SECRET)"
server-host = "127.0.0.1"
server-port = 3001
db-max-rows = 1000
openapi-mode = "disabled"
log-level = "warn"
