<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Finance Portal | IDMC iMIS</title>
  <link rel="stylesheet" href="assets/css/staff-institutional.css">
</head>
<body data-portal="finance">
<header class="masthead"><div class="brand">IDMC</div><div><strong>Institute of Development and Medical Sciences</strong><span>Integrated Management Information System</span></div><button id="menuButton" class="menu" type="button">Menu</button></header>
<div class="layout">
  <aside id="sidebar" class="sidebar">
    <section class="identity"><div class="portrait"><img id="staffPhoto" alt="Staff profile photograph"><span id="initials">ID</span></div><strong id="staffName">Staff Member</strong><small id="staffNumber">—</small><small id="staffRole">—</small></section>
    <nav id="portalNav" aria-label="Finance Portal"></nav>
    <button id="logoutButton" class="logout" type="button">Log Out</button>
  </aside>
  <main class="main"><div class="utility"><strong id="portalTitle">Finance Portal</strong><span id="today"></span></div><div id="message" class="message" hidden></div><div id="content" class="content"><p class="loading">Loading institutional records…</p></div><footer>IDMC iMIS · Authorized Staff Workspace</footer></main>
</div>
<script src="assets/js/config.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/api.js"></script><script src="assets/js/staff-workspace.js"></script>
</body>
</html>
